name: Automated Paper Trading Engine

on:
  schedule:
    # Runs Monday through Friday at 20:35 UTC (4:35 PM EDT / 9:35 PM BST)
    - cron: '35 20 * * 1-5'
  workflow_dispatch: # Allows you to manually trigger it anytime from the Actions tab

jobs:
  run-engine:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Required to commit the updated state file back to the repo

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas requests numpy

    - name: Run Trading Engine
      run: python engine.py

    - name: Commit and Push Updated State
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add trading_state_strict.json
        git diff --staged --quiet || git commit -m "Auto-update trading state [skip ci]"
        git push
